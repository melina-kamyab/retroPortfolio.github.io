<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1800" height="1350" viewBox="0 0 1800 1350"><text x="100" y="90" font-family="sans-serif" font-size="18" font-weight="normal" fill="#6d726b">ELAIN / WAYS OF WORKING</text><text x="100" y="162" font-family="serif" font-size="56" font-weight="normal" fill="#272a28">From request to delivery</text><text x="100" y="210" font-family="sans-serif" font-size="23" font-weight="normal" fill="#6d726b">A shared workflow connecting product, UX, and engineering</text><rect x="100" y="300" width="500" height="310" rx="6" fill="#faf8f4"/><text x="130" y="348" font-family="sans-serif" font-size="24" font-weight="normal" fill="#476455">01</text><text x="130" y="408" font-family="serif" font-size="30" font-weight="normal" fill="#272a28">Frame the request</text><text x="130" y="463" font-family="sans-serif" font-size="20" font-weight="normal" fill="#6d726b">Problem, assumptions, business goals</text><text x="130" y="497" font-family="sans-serif" font-size="20" font-weight="normal" fill="#6d726b">Stakeholders and success measures</text><text x="130" y="566" font-family="sans-serif" font-size="16" font-weight="normal" fill="#476455">PM / PO / UX</text><rect x="650" y="300" width="500" height="310" rx="6" fill="#faf8f4"/><text x="680" y="348" font-family="sans-serif" font-size="24" font-weight="normal" fill="#476455">02</text><text x="680" y="408" font-family="serif" font-size="30" font-weight="normal" fill="#272a28">Align &amp; decide</text><text x="680" y="463" font-family="sans-serif" font-size="20" font-weight="normal" fill="#6d726b">Agree goal, timing, and feasibility</text><text x="680" y="497" font-family="sans-serif" font-size="20" font-weight="normal" fill="#6d726b">Decide whether UX research is needed</text><text x="680" y="566" font-family="sans-serif" font-size="16" font-weight="normal" fill="#476455">PO / DEV / UX</text><rect x="1200" y="300" width="500" height="310" rx="6" fill="#faf8f4"/><text x="1230" y="348" font-family="sans-serif" font-size="24" font-weight="normal" fill="#476455">03</text><text x="1230" y="408" font-family="serif" font-size="30" font-weight="normal" fill="#272a28">Research &amp; define</text><text x="1230" y="463" font-family="sans-serif" font-size="20" font-weight="normal" fill="#6d726b">Understand needs and requirements</text><text x="1230" y="497" font-family="sans-serif" font-size="20" font-weight="normal" fill="#6d726b">Map user flows and edge cases</text><text x="1230" y="566" font-family="sans-serif" font-size="16" font-weight="normal" fill="#476455">UX</text><rect x="100" y="690" width="500" height="310" rx="6" fill="#faf8f4"/><text x="130" y="738" font-family="sans-serif" font-size="24" font-weight="normal" fill="#476455">04</text><text x="130" y="798" font-family="serif" font-size="30" font-weight="normal" fill="#272a28">Design, test &amp; review</text><text x="130" y="853" font-family="sans-serif" font-size="20" font-weight="normal" fill="#6d726b">Wireframe, test, and check feasibility</text><text x="130" y="887" font-family="sans-serif" font-size="20" font-weight="normal" fill="#6d726b">Iterate scope and stakeholder reviews</text><text x="130" y="956" font-family="sans-serif" font-size="16" font-weight="normal" fill="#476455">UX / PO / DEV / PM</text><rect x="650" y="690" width="500" height="310" rx="6" fill="#faf8f4"/><text x="680" y="738" font-family="sans-serif" font-size="24" font-weight="normal" fill="#476455">05</text><text x="680" y="798" font-family="serif" font-size="30" font-weight="normal" fill="#272a28">Agree &amp; refine</text><text x="680" y="853" font-family="sans-serif" font-size="20" font-weight="normal" fill="#6d726b">Review the prototype before development</text><text x="680" y="887" font-family="sans-serif" font-size="20" font-weight="normal" fill="#6d726b">Define roadmap, epics, and priorities</text><text x="680" y="956" font-family="sans-serif" font-size="16" font-weight="normal" fill="#476455">UX / PO / DEV / SCRUM</text><rect x="1200" y="690" width="500" height="310" rx="6" fill="#faf8f4"/><text x="1230" y="738" font-family="sans-serif" font-size="24" font-weight="normal" fill="#476455">06</text><text x="1230" y="798" font-family="serif" font-size="30" font-weight="normal" fill="#272a28">Develop &amp; deliver</text><text x="1230" y="853" font-family="sans-serif" font-size="20" font-weight="normal" fill="#6d726b">Refine, build, and check requirements</text><text x="1230" y="887" font-family="sans-serif" font-size="20" font-weight="normal" fill="#6d726b">Deliver incrementally each sprint</text><text x="1230" y="956" font-family="sans-serif" font-size="16" font-weight="normal" fill="#476455">PO / DEV / SCRUM / TEAM</text><text x="100" y="1145" font-family="sans-serif" font-size="24" font-weight="normal" fill="#476455">Research can be skipped when appropriate. Reviews repeat as needed.</text><text x="100" y="1190" font-family="sans-serif" font-size="24" font-weight="normal" fill="#6d726b">The depth of the process adapts to the size of the delivery.</text><text x="100" y="1275" font-family="sans-serif" font-size="18" font-weight="normal" fill="#6d726b">Portfolio summary adapted from the original process presentation.</text></svg>